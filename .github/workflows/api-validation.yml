name: TRACE API validation

on:
  push:
    branches: [main, fix/non-model-api-validation-2026-10-29]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  api-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install focused API test dependencies
        run: python -m pip install fastapi httpx pytest python-multipart pandas
      - name: Check Python syntax
        run: python -m compileall -q main.py llm.py dashboard tests
      - name: Run API validation tests
        run: python -m pytest -q tests/test_api_validation.py
