name: TRACE artifact integrity

on:
  push:
    branches: [main, fix/moe-artifact-recovery]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  static-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install focused test dependencies
        run: python -m pip install pytest
      - name: Compile recovery scripts
        run: python -m py_compile scripts/check_artifacts.py scripts/recover_rf_candidate.py scripts/restore_lgb_from_zip.py
      - name: Test artifact integrity checker
        run: python -m pytest -q tests/test_artifact_integrity.py
      - name: Inventory model artifacts (recovery diagnostics)
        continue-on-error: true
        run: python scripts/check_artifacts.py
